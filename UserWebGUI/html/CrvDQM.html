<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRV Online DQM</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>

        :root {
            --primary-color: #3366CC;      
            --primary-light: #99CCFF;      
            --primary-dark: #0033AA;       
            --accent-color: #4285f4;       
            --azure-light: #99CCFF;        
            --azure-medium: #66AAFF;        
            --blue-medium: #3366CC;         
            --text-color: #202124;          
            --text-light: #ffffff;          
            --text-secondary: #5f6368;      
            --background-color: #f8f9fa;    
            --sidebar-bg: #f0f6ff;          
            --sidebar-active: #d2e3fc;      
            --card-color: #ffffff;          
            --border-color: #dadce0;        
            --hover-color: #e8f0fe;         
            --active-color: #d2e3fc;        
            --shadow-sm: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
            --shadow-md: 0 2px 6px 2px rgba(60, 64, 67, 0.15), 0 1px 2px 0 rgba(60, 64, 67, 0.3);
            --sidebar-width: 280px;
            --header-height: 64px;
            --border-radius: 8px;
            --transition-speed: 0.2s;
        }
            
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        .header {
            background-color: var(--card-color);
            color: var(--text-color);
            height: var(--header-height);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            z-index: 10;
            position: relative;
        }
        
        .header-left {
            display: flex;
            align-items: center;
        }
        
        .menu-toggle {
            margin-right: 16px;
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .menu-toggle:hover {
            background-color: var(--hover-color);
        }
        
        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 500;
            color: var(--primary-color);
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
        } 
        
        .header-button {
            background: none;
            border: none;
            height: 40px;
            width: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background-color var(--transition-speed);
        }
        
        .header-button:hover {
            background-color: var(--hover-color);
            color: var(--primary-color);
        }
        
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--card-color);
            box-shadow: var(--shadow-sm);
            z-index: 5;
            transition: transform var(--transition-speed);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar.collapsed {
            transform: translateX(calc(-1 * var(--sidebar-width)));
        }
        
        .main-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        .nav-group {
            margin-bottom: 8px;
            padding: 16px 16px 8px;
        }
        
        .nav-header {
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding: 0 8px;
        }
        
        .nav-item {
            padding: 12px 16px;
            cursor: pointer;
            border-radius: var(--border-radius);
            transition: background-color var(--transition-speed);
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .nav-item i {
            margin-right: 12px;
            font-size: 18px;
            color: var(--text-secondary);
            width: 24px;
            text-align: center;
        }
        
        .nav-item:hover {
            background-color: var(--hover-color);
        }
        
        .nav-item.active {
            background-color: var(--active-color);
            color: var(--primary-color);
        }
        
        .nav-item.active i {
            color: var(--primary-color);
        }
        
        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .breadcrumb-divider {
            font-size: 12px;
        }
        
        .content-card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .card-title {
            font-size: 16px;
            font-weight: 500;
        }
        
        .card-actions {
            display: flex;
            gap: 8px;
        }
        
        .card-action {
            background: none;
            border: none;
            height: 32px;
            width: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background-color var(--transition-speed);
        }
        
        .card-action:hover {
            background-color: var(--hover-color);
            color: var(--primary-color);
        }
        
        .card-body {
            padding: 16px 20px;
            flex: 1;
            overflow: hidden;
        }
        
        #drawing {
            width: 100%;
            height: 100%;
            min-height: 500px;
            background-color: var(--card-color);
            border-radius: var(--border-radius);
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .loading-spinner {
            border: 3px solid var(--hover-color);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            padding: 16px;
            color: #d93025;
            background-color: #fce8e6;
            border-radius: var(--border-radius);
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        
        .error-message i {
            margin-right: 8px;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                height: calc(100vh - var(--header-height));
                transform: translateX(calc(-1 * var(--sidebar-width)));
            }
            
            .sidebar.expanded {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>

        <div class="main-content">
            <div class="breadcrumbs">
                <span>Monitoring</span>
                <span class="breadcrumb-divider"><i class="fas fa-chevron-right"></i></span>
                <span id="current-page">Overview</span>
            </div>
            
            <div class="content-card">
                <div class="card-header">
                    <div class="card-title" id="card-title">Overview</div>
                    <div class="card-actions">
                        <button class="card-action" title="Download" id="download-btn">
                            <i class="fas fa-download"></i>
                        </button>
                        <button class="card-action" title="Expand" id="expand-btn">
                            <i class="fas fa-expand"></i>

                        <!-- <button class="card-action" title="More options">

    <!-- Import JSROOT -->
    <script type="text/javascript" src="jsrootsys/scripts/JSRoot.core.js"></script>
    
    <script type="text/javascript">

    // Wait for JSROOT to be ready
    JSROOT.require(['hierarchy']).then(function() {
        // Initialize the app
        initApp();
        
        // Polling interval in milliseconds
        const POLL_INTERVAL = 250; 
        
        // Start polling after a delay to ensure initial drawing is complete
        setTimeout(function() {
            // Set up polling for updates
            setInterval(function() {
                const activeItem = document.querySelector('.nav-item.active');
                if (!activeItem) return;
                
                const objectPath = activeItem.getAttribute('data-object');
                const drawOpt = activeItem.getAttribute('data-opt') || "";
                
                // Cache-busting timestamp
                const timestamp = new Date().getTime();
                
                // Request the object with cache busting
                JSROOT.httpRequest(objectPath + "/root.json?_=" + timestamp, 'object')
                    .then(function(obj) {
                        // Only update if drawing element exists and has content
                        const drawingDiv = document.getElementById('drawing');
                        if (drawingDiv && drawingDiv.childElementCount > 0) {
                            // Use redraw for safer updates
                            JSROOT.redraw('drawing', obj, drawOpt);
                        }
                    })
                    .catch(function(err) {
                        console.log("Refresh error (can ignore if changing views):", err);
                    });
            }, POLL_INTERVAL);
        }, POLL_INTERVAL); // Sleep before starting poll
    });

    function initApp() {
        // Get all navigation items
        const navItems = document.querySelectorAll('.nav-item');
        
        // Add click event to each navigation item
        navItems.forEach(item => {
            item.addEventListener('click', function(event) {
                event.preventDefault();
                
                // Remove active class from all items
                navItems.forEach(item => item.classList.remove('active'));
                
                // Add active class to clicked item
                this.classList.add('active');
                
                // Get page name, object path and drawing options
                const pageName = this.getAttribute('data-page');
                const objectPath = this.getAttribute('data-object');
                const drawOpt = this.getAttribute('data-opt') || "";
                
                // Update breadcrumb and card title
                document.getElementById('current-page').textContent = 
                    this.textContent.trim();
                document.getElementById('card-title').textContent = 
                    this.textContent.trim();
                
                // Draw the selected object
                drawObject(objectPath, drawOpt);
                
                // Close sidebar on mobile
                if (window.innerWidth <= 768) {
                    document.getElementById('sidebar').classList.add('collapsed');
                }
            });
        });
        
        // Toggle sidebar
        document.getElementById('menu-toggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        });
        
        // Add manual refresh button handler
        document.querySelector('.header-button[title="Refresh"]').addEventListener('click', function() {
            const activeItem = document.querySelector('.nav-item.active');
            if (activeItem) {
                // Show spinner during refresh
                const icon = this.querySelector('i');
                icon.className = "fas fa-spinner fa-spin";
                
                const objectPath = activeItem.getAttribute('data-object');
                const drawOpt = activeItem.getAttribute('data-opt') || "";
                
                // Add cache busting
                const cacheBuster = '?_=' + new Date().getTime();
                
                // Request the updated object
                JSROOT.httpRequest(objectPath + "/root.json" + cacheBuster, 'object')
                    .then(obj => {
                        // Use redraw for safer updates
                        JSROOT.redraw('drawing', obj, drawOpt);
                        
                        // Reset icon after a moment
                        setTimeout(() => {
                            icon.className = "fas fa-sync-alt";
                        }, 1000);
                    })
                    .catch(err => {
                        console.error('Error refreshing:', err);
                        // Reset icon on error
                        icon.className = "fas fa-sync-alt";
                    });
            }
        });
        
        // Add download functionality
        // document.getElementById('download-btn').addEventListener('click', function() {
        //     JSROOT.makeSnapshot(document.getElementById('drawing'));
        // });

        // Add download functionality
        // Still doesn't work
        document.getElementById('download-btn').addEventListener('click', function() {
            // Get the current object being displayed
            const currentObj = document.querySelector('.nav-item.active').getAttribute('data-object');
            
            // Generate a meaningful filename based on the current view
            const pageName = document.getElementById('current-page').textContent;
            const filename = `CRV_${pageName}_${new Date().toISOString().split('T')[0]}.png`;
            
            // Use JSROOT's snapshot functionality properly
            JSROOT.NewHttpRequest(currentObj + "/root.png.json?more=2000&w=2000&h=1600", 'object', function(obj) {
                if (obj) {
                    // Create download link for the image
                    let link = document.createElement('a');
                    link.download = filename;
                    link.href = obj.result;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } else {
                    console.error("Failed to create snapshot");
                }
            }).send();
        });

        // Add expand functionality
        document.getElementById('expand-btn').addEventListener('click', function() {
            const drawingDiv = document.getElementById('drawing');
            if (!document.fullscreenElement) {
                if (drawingDiv.requestFullscreen) {
                    drawingDiv.requestFullscreen();
                } else if (drawingDiv.webkitRequestFullscreen) {
                    drawingDiv.webkitRequestFullscreen();
                } else if (drawingDiv.msRequestFullscreen) {
                    drawingDiv.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        });
        
        // Handle ESC key to exit fullscreen
        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement) {
                // Resize the plot to fit the container again
                JSROOT.resize(document.getElementById('drawing'));
            }
        });
        
        // Draw the first item by default
        if (navItems.length > 0) {
            navItems[0].click();
        }
        
        // Handle window resize
        window.addEventListener('resize', function() {
            JSROOT.resize(document.getElementById('drawing'));
        });
    }

    // Function to draw a ROOT object
    function drawObject(objectPath, drawOpt) {
        // Clear previous drawing
        document.getElementById('drawing').innerHTML = '';
        
        // Show loading indicator
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'loading';
        const spinner = document.createElement('div');
        spinner.className = 'loading-spinner';
        loadingDiv.appendChild(spinner);
        loadingDiv.appendChild(document.createTextNode('Loading data...'));
        document.getElementById('drawing').appendChild(loadingDiv);
        
        // Add cache busting parameter
        const cacheBuster = '?_=' + new Date().getTime();
        
        // Request the object from the server with cache busting
        JSROOT.httpRequest(objectPath + "/root.json" + cacheBuster, 'object').then(obj => {
            // Remove loading indicator
            document.getElementById('drawing').innerHTML = '';
            
            // Draw the object
            JSROOT.draw('drawing', obj, drawOpt);
        }).catch(err => {
            console.error('Error loading object:', err);
            
            // Show error message
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            const errorIcon = document.createElement('i');
            errorIcon.className = 'fas fa-exclamation-triangle';
            errorDiv.appendChild(errorIcon);
            errorDiv.appendChild(document.createTextNode('Error loading data: ' + err));
            
            document.getElementById('drawing').innerHTML = '';
            document.getElementById('drawing').appendChild(errorDiv);
        });
    }
    </script>
