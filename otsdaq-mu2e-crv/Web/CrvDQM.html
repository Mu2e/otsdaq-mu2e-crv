<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRV Online DQM</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-dark: #0d47a1;
            --accent-color: #4285f4;
            --text-color: #202124;
            --text-secondary: #5f6368;
            --background-color: #f8f9fa;
            --card-color: #ffffff;
            --border-color: #dadce0;
            --hover-color: #e8f0fe;
            --active-color: #d2e3fc;
            --shadow-sm: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
            --shadow-md: 0 2px 6px 2px rgba(60, 64, 67, 0.15), 0 1px 2px 0 rgba(60, 64, 67, 0.3);
            --sidebar-width: 280px;
            --header-height: 64px;
            --border-radius: 8px;
            --transition-speed: 0.2s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        .header {
            background-color: var(--card-color);
            color: var(--text-color);
            height: var(--header-height);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            z-index: 10;
            position: relative;
        }
        
        .header-left {
            display: flex;
            align-items: center;
        }
        
        .menu-toggle {
            margin-right: 16px;
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .menu-toggle:hover {
            background-color: var(--hover-color);
        }
        
        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 500;
            color: var(--primary-color);
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
        }
        
        .header-button {
            background: none;
            border: none;
            height: 40px;
            width: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background-color var(--transition-speed);
        }
        
        .header-button:hover {
            background-color: var(--hover-color);
            color: var(--primary-color);
        }
        
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--card-color);
            box-shadow: var(--shadow-sm);
            z-index: 5;
            transition: transform var(--transition-speed);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar.collapsed {
            transform: translateX(calc(-1 * var(--sidebar-width)));
        }
        
        .main-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        .nav-group {
            margin-bottom: 8px;
            padding: 16px 16px 8px;
        }
        
        .nav-header {
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding: 0 8px;
        }
        
        .nav-item {
            padding: 12px 16px;
            cursor: pointer;
            border-radius: var(--border-radius);
            transition: background-color var(--transition-speed);
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .nav-item i {
            margin-right: 12px;
            font-size: 18px;
            color: var(--text-secondary);
            width: 24px;
            text-align: center;
        }
        
        .nav-item:hover {
            background-color: var(--hover-color);
        }
        
        .nav-item.active {
            background-color: var(--active-color);
            color: var(--primary-color);
        }
        
        .nav-item.active i {
            color: var(--primary-color);
        }
        
        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .breadcrumb-divider {
            font-size: 12px;
        }
        
        .content-card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .card-title {
            font-size: 16px;
            font-weight: 500;
        }
        
        .card-actions {
            display: flex;
            gap: 8px;
        }
        
        .card-action {
            background: none;
            border: none;
            height: 32px;
            width: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background-color var(--transition-speed);
        }
        
        .card-action:hover {
            background-color: var(--hover-color);
            color: var(--primary-color);
        }
        
        .card-body {
            padding: 16px 20px;
            flex: 1;
            overflow: hidden;
        }
        
        #drawing {
            width: 100%;
            height: 100%;
            min-height: 500px;
            background-color: var(--card-color);
            border-radius: var(--border-radius);
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .loading-spinner {
            border: 3px solid var(--hover-color);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            padding: 16px;
            color: #d93025;
            background-color: #fce8e6;
            border-radius: var(--border-radius);
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        
        .error-message i {
            margin-right: 8px;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                height: calc(100vh - var(--header-height));
                transform: translateX(calc(-1 * var(--sidebar-width)));
            }
            
            .sidebar.expanded {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
                <i class="fas fa-bars"></i>
            </button>
            <h1>CRV Online DQM</h1>
        </div>
        <div class="header-actions">
            <button class="header-button" title="Settings">
                <i class="fas fa-cog"></i>
            </button>
            <button class="header-button" title="Help">
                <i class="fas fa-question-circle"></i>
            </button>
            <button class="header-button" title="Refresh">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>
    
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="nav-group">
                <div class="nav-header">Monitoring</div>
                <a href="#" class="nav-item active" data-page="overview" data-object="/Canvases/Overview">
                    <i class="fas fa-tachometer-alt"></i>
                    Overview
                </a>
                <a href="#" class="nav-item" data-page="channels" data-object="/Canvases/Channels">
                    <i class="fas fa-chart-bar"></i>
                    Channels
                </a>
                <a href="#" class="nav-item" data-page="events" data-object="/Canvases/Events">
                    <i class="fas fa-bolt"></i>
                    Events
                </a>
                <a href="#" class="nav-item" data-page="triggers" data-object="/Canvases/Triggers">
                    <i class="fas fa-clock"></i>
                    Triggers
                </a>
            </div>
            
            <div class="nav-group">
                <div class="nav-header">Analysis</div>
                <a href="#" class="nav-item" data-page="quality" data-object="/Canvases/Quality">
                    <i class="fas fa-check-circle"></i>
                    Data Quality
                </a>
                <a href="#" class="nav-item" data-page="trends" data-object="/Canvases/Trends">
                    <i class="fas fa-chart-line"></i>
                    Trends
                </a>
            </div>
            
            <div class="nav-group">
                <div class="nav-header">System</div>
                <a href="#" class="nav-item" data-page="status" data-object="/Canvases/Status">
                    <i class="fas fa-heartbeat"></i>
                    Status
                </a>
                <a href="#" class="nav-item" data-page="logs" data-object="/Canvases/Logs">
                    <i class="fas fa-clipboard-list"></i>
                    Logs
                </a>
            </div>
        </div>
        
        <div class="main-content">
            <div class="breadcrumbs">
                <span>Monitoring</span>
                <span class="breadcrumb-divider"><i class="fas fa-chevron-right"></i></span>
                <span id="current-page">Overview</span>
            </div>
            
            <div class="content-card">
                <div class="card-header">
                    <div class="card-title" id="card-title">Overview Canvas</div>
                    <div class="card-actions">
                        <button class="card-action" title="Download" id="download-btn">
                            <i class="fas fa-download"></i>
                        </button>
                        <button class="card-action" title="Expand" id="expand-btn">
                            <i class="fas fa-expand"></i>
                        </button>
                        <button class="card-action" title="More options">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="drawing"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Import JSROOT -->
    <script type="text/javascript" src="jsrootsys/scripts/JSRoot.core.js"></script>
    
    <script type="text/javascript">
        // Toggle sidebar
        document.getElementById('menu-toggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        });
        
        // Wait for JSROOT to be ready
        JSROOT.require(['hierarchy']).then(initApp);
        
        function initApp() {
            // Get all navigation items
            const navItems = document.querySelectorAll('.nav-item');
            
            // Add click event to each navigation item
            navItems.forEach(item => {
                item.addEventListener('click', function(event) {
                    event.preventDefault();
                    
                    // Remove active class from all items
                    navItems.forEach(item => item.classList.remove('active'));
                    
                    // Add active class to clicked item
                    this.classList.add('active');
                    
                    // Get page name, object path and drawing options
                    const pageName = this.getAttribute('data-page');
                    const objectPath = this.getAttribute('data-object');
                    const drawOpt = this.getAttribute('data-opt') || "";
                    
                    // Update breadcrumb and card title
                    document.getElementById('current-page').textContent = 
                        this.textContent.trim();
                    document.getElementById('card-title').textContent = 
                        this.textContent.trim() + " Canvas";
                    
                    // Draw the selected object
                    drawObject(objectPath, drawOpt);
                    
                    // Close sidebar on mobile
                    if (window.innerWidth <= 768) {
                        document.getElementById('sidebar').classList.add('collapsed');
                    }
                });
            });
            
            // Add download functionality
            document.getElementById('download-btn').addEventListener('click', function() {
                JSROOT.makeSnapshot(document.getElementById('drawing'));
            });
            
            // Add expand functionality
            document.getElementById('expand-btn').addEventListener('click', function() {
                const drawingDiv = document.getElementById('drawing');
                if (!document.fullscreenElement) {
                    if (drawingDiv.requestFullscreen) {
                        drawingDiv.requestFullscreen();
                    } else if (drawingDiv.webkitRequestFullscreen) {
                        drawingDiv.webkitRequestFullscreen();
                    } else if (drawingDiv.msRequestFullscreen) {
                        drawingDiv.msRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                }
            });
            
            // Draw the first item by default
            if (navItems.length > 0) {
                navItems[0].click();
            }
            
            // Handle window resize
            window.addEventListener('resize', function() {
                JSROOT.resize(document.getElementById('drawing'));
            });
        }
        
        // Function to draw a ROOT object
        function drawObject(objectPath, drawOpt) {
            // Clear previous drawing
            document.getElementById('drawing').innerHTML = '';
            
            // Show loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            const spinner = document.createElement('div');
            spinner.className = 'loading-spinner';
            loadingDiv.appendChild(spinner);
            loadingDiv.appendChild(document.createTextNode('Loading data...'));
            document.getElementById('drawing').appendChild(loadingDiv);
            
            // Request the object from the server
            JSROOT.httpRequest(objectPath + "/root.json.gz", 'object').then(obj => {
                // Remove loading indicator
                document.getElementById('drawing').innerHTML = '';
                
                // Draw the object
                JSROOT.draw('drawing', obj, drawOpt);
            }).catch(err => {
                console.error('Error loading object:', err);
                
                // Show error message
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                const errorIcon = document.createElement('i');
                errorIcon.className = 'fas fa-exclamation-triangle';
                errorDiv.appendChild(errorIcon);
                errorDiv.appendChild(document.createTextNode('Error loading data: ' + err));
                
                document.getElementById('drawing').innerHTML = '';
                document.getElementById('drawing').appendChild(errorDiv);
            });
        }
    </script>
</body>
</html>
